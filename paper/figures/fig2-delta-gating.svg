<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>

  <defs>
    <marker id="a4" markerWidth="8" markerHeight="8" refX="7.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7.2,3 L0,6 z" fill="#333333"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="15" font-weight="600" fill="#111111">Δ-gating: multiplying the mask into the discretization step makes skipping identical to state preservation</text>

  <!-- ===== connectors first ===== -->
  <g stroke="#333333" stroke-width="1.4" fill="none">
    <path d="M140,110 H172 V156" marker-end="url(#a4)"/>
    <path d="M140,210 H172 V164" marker-end="url(#a4)"/>
    <path d="M172,160 H206" marker-end="url(#a4)"/>
    <path d="M330,160 H366" marker-end="url(#a4)"/>
    <path d="M490,160 H526" marker-end="url(#a4)"/>
    <path d="M690,160 H720 V96 H741" marker-end="url(#a4)"/>
    <path d="M720,160 V266 H741" marker-end="url(#a4)"/>
  </g>
  <circle cx="172" cy="160" r="2.6" fill="#333333"/>
  <circle cx="720" cy="160" r="2.6" fill="#333333"/>

  <!-- ===== frames ===== -->
  <text x="90" y="66" font-size="11" fill="#555555" text-anchor="middle">frame t-1</text>
  <rect x="40" y="74" width="100" height="72" fill="#fafafa" stroke="#888888" stroke-width="1.1"/>
  <g stroke="#e0e0e0" stroke-width="0.8" fill="none">
    <line x1="65" y1="74" x2="65" y2="146"/><line x1="90" y1="74" x2="90" y2="146"/><line x1="115" y1="74" x2="115" y2="146"/>
    <line x1="40" y1="98" x2="140" y2="98"/><line x1="40" y1="122" x2="140" y2="122"/>
  </g>
  <circle cx="78" cy="110" r="11" fill="#f7cbb0" stroke="#c0670c" stroke-width="1.1"/>

  <text x="90" y="166" font-size="11" fill="#555555" text-anchor="middle">frame t</text>
  <rect x="40" y="174" width="100" height="72" fill="#fafafa" stroke="#888888" stroke-width="1.1"/>
  <g stroke="#e0e0e0" stroke-width="0.8" fill="none">
    <line x1="65" y1="174" x2="65" y2="246"/><line x1="90" y1="174" x2="90" y2="246"/><line x1="115" y1="174" x2="115" y2="246"/>
    <line x1="40" y1="198" x2="140" y2="198"/><line x1="40" y1="222" x2="140" y2="222"/>
  </g>
  <circle cx="102" cy="210" r="11" fill="#c0670c" stroke="#8a4a08" stroke-width="1.1"/>
  <text x="90" y="264" font-size="10" fill="#777777" text-anchor="middle">static background, object moves</text>

  <!-- ===== detector ===== -->
  <rect x="206" y="128" width="124" height="64" rx="2" fill="#eaf1f8" stroke="#0f5c96" stroke-width="1.2"/>
  <text x="268" y="154" font-size="11.5" font-weight="600" fill="#0b3f68" text-anchor="middle">Change detector</text>
  <text x="268" y="172" font-size="10" fill="#0b3f68" text-anchor="middle">patch-wise comparison</text>

  <!-- ===== mask ===== -->
  <text x="428" y="108" font-size="11" font-weight="600" fill="#0b3f68" text-anchor="middle">Binary mask M</text>
  <g stroke="#8fb4d2" stroke-width="1" fill="#ffffff">
    <rect x="368" y="118" width="30" height="28"/><rect x="398" y="118" width="30" height="28"/>
    <rect x="428" y="118" width="30" height="28"/><rect x="458" y="118" width="30" height="28"/>
    <rect x="368" y="146" width="30" height="28"/><rect x="398" y="146" width="30" height="28" fill="#0f5c96"/>
    <rect x="428" y="146" width="30" height="28" fill="#0f5c96"/><rect x="458" y="146" width="30" height="28"/>
    <rect x="368" y="174" width="30" height="28"/><rect x="398" y="174" width="30" height="28"/>
    <rect x="428" y="174" width="30" height="28"/><rect x="458" y="174" width="30" height="28"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="383" y="137" fill="#aaaaaa">0</text><text x="413" y="137" fill="#aaaaaa">0</text>
    <text x="443" y="137" fill="#aaaaaa">0</text><text x="473" y="137" fill="#aaaaaa">0</text>
    <text x="383" y="165" fill="#aaaaaa">0</text><text x="413" y="165" fill="#ffffff" font-weight="600">1</text>
    <text x="443" y="165" fill="#ffffff" font-weight="600">1</text><text x="473" y="165" fill="#aaaaaa">0</text>
    <text x="383" y="193" fill="#aaaaaa">0</text><text x="413" y="193" fill="#aaaaaa">0</text>
    <text x="443" y="193" fill="#aaaaaa">0</text><text x="473" y="193" fill="#aaaaaa">0</text>
  </g>
  <text x="428" y="220" font-size="10" fill="#777777" text-anchor="middle">1 only where changed</text>

  <!-- ===== gating ===== -->
  <rect x="526" y="124" width="164" height="72" rx="2" fill="#eaf4f0" stroke="#00705a" stroke-width="1.4"/>
  <text x="608" y="148" font-size="11.5" font-weight="600" fill="#004a3c" text-anchor="middle">Δ-gating</text>
  <text x="608" y="175" font-size="17" font-style="italic" fill="#004a3c" text-anchor="middle">Δ̃ = M · Δ</text>
  <text x="608" y="216" font-size="10" fill="#555555" text-anchor="middle">multiplied into a parameter the model</text>
  <text x="608" y="230" font-size="10" fill="#555555" text-anchor="middle">already had, nothing added</text>

  <!-- ===== active branch ===== -->
  <rect x="741" y="60" width="234" height="72" rx="2" fill="#f7f7f7" stroke="#555555" stroke-width="1.2"/>
  <text x="753" y="80" font-size="11" font-weight="600" fill="#333333">M = 1 · changed patch</text>
  <text x="753" y="99" font-size="11" fill="#444444">Ā = exp(ΔA), B̄ ≠ 0</text>
  <text x="753" y="118" font-size="11.5" font-weight="600" fill="#111111">h(t) = Ā h(t−1) + B̄ x(t)</text>
  <text x="753" y="150" font-size="10" fill="#555555">standard update: new information enters the state</text>
  <text x="753" y="164" font-size="10" fill="#555555">computed</text>

  <!-- ===== static branch ===== -->
  <rect x="741" y="230" width="234" height="72" rx="2" fill="#eaf4f0" stroke="#00705a" stroke-width="1.4"/>
  <text x="753" y="250" font-size="11" font-weight="600" fill="#004a3c">M = 0 · static patch</text>
  <text x="753" y="269" font-size="11" fill="#004a3c">Ā = exp(0·A) = I, B̄ = 0</text>
  <text x="753" y="290" font-size="12.5" font-weight="600" fill="#004a3c">h(t) = h(t−1)</text>
  <text x="753" y="320" font-size="10" font-weight="600" fill="#004a3c">state copied exactly, not approximated</text>
  <text x="753" y="334" font-size="10" fill="#00705a">computation bypassed</text>

  <!-- ===== bottom note ===== -->
  <line x1="40" y1="374" x2="960" y2="374" stroke="#cccccc" stroke-width="1"/>
  <text x="40" y="398" font-size="11.5" font-weight="600" fill="#111111">The point: skipping does not cause state preservation, it is algebraically identical to it</text>
  <text x="40" y="420" font-size="10.5" fill="#555555">Early exit and token dropping replace the skipped part with zero or an approximation, and that error accumulates across frames.</text>
  <text x="40" y="437" font-size="10.5" fill="#555555">Δ-gating is the exact limit of the discretization, so consecutive skips introduce no state contamination.</text>
</svg>
