<text x="428.0" y="48.0" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">fused kernel</text>
<text x="30.0" y="344.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-style="normal">The kernel made every path faster and, in doing so, made the dense path the fastest at every activity level: what sparsity saved was</text>
<text x="30.0" y="360.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-style="normal">the scan, and the scan is now nearly free. What remains in the sparse path is bookkeeping that does not scale with activity.</text>
