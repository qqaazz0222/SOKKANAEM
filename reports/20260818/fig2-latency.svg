<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Helvetica, Arial, 'Noto Sans KR', sans-serif">
  <rect width="880" height="470" fill="#ffffff"/>

  <text x="40" y="32" font-size="15" font-weight="600" fill="#111111">Figure. 융합 스캔 커널 전후의 프레임당 지연 시간 (변화 패치 22%)</text>
  <text x="40" y="50" font-size="10.5" fill="#666666">단일 GPU · 입력 256×256 · 단일 스트림 · 단정밀도 · 3회 측정 최솟값. 커널 적용 후에는 다섯 경로 모두 변화 패치 비율에 거의 무관하게 평평하다.</text>

  <!-- target line -->
  <line x1="365" y1="70" x2="365" y2="316" stroke="#c0670c" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="369" y="82" font-size="10" fill="#8a4a08">목표선 2.34 ms</text>

  <!-- grid -->
  <g stroke="#ececec" stroke-width="0.9">
    <line x1="350" y1="70" x2="350" y2="310"/><line x1="440" y1="70" x2="440" y2="310"/>
    <line x1="530" y1="70" x2="530" y2="310"/><line x1="620" y1="70" x2="620" y2="310"/>
    <line x1="710" y1="70" x2="710" y2="310"/><line x1="800" y1="70" x2="800" y2="310"/>
  </g>
  <line x1="260" y1="310" x2="800" y2="310" stroke="#333333" stroke-width="1.2"/>
  <line x1="260" y1="70" x2="260" y2="310" stroke="#333333" stroke-width="1.2"/>
  <g font-size="10.5" fill="#444444" text-anchor="middle">
    <text x="260" y="328">0</text><text x="350" y="328">2</text><text x="440" y="328">4</text>
    <text x="530" y="328">6</text><text x="620" y="328">8</text><text x="710" y="328">10</text>
    <text x="800" y="328">12</text>
  </g>
  <text x="530" y="348" font-size="11" fill="#333333" text-anchor="middle">프레임당 지연 시간 (ms)</text>

  <!-- rows: label, before bar (hollow), after bar (solid) -->
  <g font-size="11" fill="#333333" text-anchor="end">
    <text x="250" y="104">전체 연산, 컴파일 없음</text>
    <text x="250" y="148">전체 연산, 컴파일</text>
    <text x="250" y="192">희소, 컴파일 없음</text>
    <text x="250" y="236">희소 + 버킷</text>
    <text x="250" y="280">희소 + 버킷 + 컴파일</text>
  </g>

  <!-- before (chunked scan) -->
  <g fill="#ffffff" stroke="#9a9a9a" stroke-width="1.1">
    <rect x="260" y="88" width="512" height="15"/>
    <rect x="260" y="132" width="212" height="15"/>
    <rect x="260" y="176" width="219" height="15"/>
    <rect x="260" y="220" width="243" height="15"/>
    <rect x="260" y="264" width="135" height="15"/>
  </g>
  <g font-size="10" fill="#777777">
    <text x="778" y="100">11.38</text>
    <text x="478" y="144">4.70</text>
    <text x="485" y="188">4.87</text>
    <text x="509" y="232">5.39</text>
    <text x="401" y="276">2.99</text>
  </g>

  <!-- after (fused kernel) -->
  <g fill="#0f5c96">
    <rect x="260" y="105" width="89" height="15"/>
    <rect x="260" y="149" width="58" height="15"/>
    <rect x="260" y="193" width="108" height="15"/>
    <rect x="260" y="237" width="115" height="15"/>
    <rect x="260" y="281" width="92" height="15"/>
  </g>
  <g font-size="10.5" font-weight="600" fill="#0b3f68">
    <text x="355" y="117">1.98  (5.7배)</text>
    <text x="324" y="161">1.29  (3.6배)  — 최속</text>
    <text x="374" y="205">2.40</text>
    <text x="381" y="249">2.55</text>
    <text x="358" y="293">2.04  (1.5배)</text>
  </g>

  <!-- legend -->
  <rect x="262" y="366" width="22" height="12" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.1"/>
  <text x="292" y="376" font-size="11" fill="#444444">기존 청크 스캔</text>
  <rect x="400" y="366" width="22" height="12" fill="#0f5c96"/>
  <text x="430" y="376" font-size="11" fill="#444444">융합 커널</text>

  <!-- note -->
  <line x1="40" y1="398" x2="840" y2="398" stroke="#dddddd" stroke-width="1"/>
  <text x="40" y="418" font-size="10.5" font-weight="600" fill="#111111">커널이 목표선을 통과시켰지만, 동시에 희소 경로가 존재하던 이유도 없앴다.</text>
  <text x="40" y="436" font-size="10" fill="#666666">희소 경로가 아끼던 것이 바로 스캔인데 그 스캔이 거의 공짜가 되면서, 남은 것은 변화 비율과 무관한 고정 비용(토큰 수집·정렬·캐시 복사·동기화)뿐이다.</text>
  <text x="40" y="452" font-size="10" fill="#666666">그 결과 이 GPU에서는 모든 변화 비율에서 전체 연산이 더 빠르다. 희소성의 이득은 현재 연산량(37.0%)과 스트림당 상태 메모리로만 입증되어 있다.</text>
</svg>
