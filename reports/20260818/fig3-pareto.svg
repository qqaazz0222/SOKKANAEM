<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" width="780" height="480" font-family="Helvetica, Arial, 'Noto Sans KR', sans-serif">
  <rect width="780" height="480" fill="#ffffff"/>

  <text x="40" y="32" font-size="15" font-weight="600" fill="#111111">Figure. 파라미터 규모 대비 정확도, 원 크기는 프레임 간 변동</text>
  <text x="40" y="50" font-size="10.5" fill="#666666">실촬 실내 홀드아웃 · 데이터셋 균등 평균 · 소스당 100클립 · 세 모델 동일 평가 프로토콜</text>

  <!-- grid -->
  <g stroke="#ececec" stroke-width="0.9">
    <line x1="100" y1="60" x2="620" y2="60"/>
    <line x1="100" y1="102.9" x2="620" y2="102.9"/>
    <line x1="100" y1="145.7" x2="620" y2="145.7"/>
    <line x1="100" y1="188.6" x2="620" y2="188.6"/>
    <line x1="100" y1="231.4" x2="620" y2="231.4"/>
    <line x1="100" y1="274.3" x2="620" y2="274.3"/>
    <line x1="100" y1="317.1" x2="620" y2="317.1"/>
  </g>
  <g stroke="#f4f4f4" stroke-width="0.9">
    <line x1="107.8" y1="60" x2="107.8" y2="360"/>
    <line x1="258.9" y1="60" x2="258.9" y2="360"/>
    <line x1="396.7" y1="60" x2="396.7" y2="360"/>
    <line x1="547.8" y1="60" x2="547.8" y2="360"/>
  </g>

  <!-- axes -->
  <line x1="100" y1="360" x2="620" y2="360" stroke="#333333" stroke-width="1.2"/>
  <line x1="100" y1="60" x2="100" y2="360" stroke="#333333" stroke-width="1.2"/>
  <g stroke="#333333" stroke-width="1">
    <line x1="96" y1="360" x2="100" y2="360"/><line x1="96" y1="317.1" x2="100" y2="317.1"/>
    <line x1="96" y1="274.3" x2="100" y2="274.3"/><line x1="96" y1="231.4" x2="100" y2="231.4"/>
    <line x1="96" y1="188.6" x2="100" y2="188.6"/><line x1="96" y1="145.7" x2="100" y2="145.7"/>
    <line x1="96" y1="102.9" x2="100" y2="102.9"/><line x1="96" y1="60" x2="100" y2="60"/>
    <line x1="107.8" y1="360" x2="107.8" y2="364"/><line x1="258.9" y1="360" x2="258.9" y2="364"/>
    <line x1="396.7" y1="360" x2="396.7" y2="364"/><line x1="547.8" y1="360" x2="547.8" y2="364"/>
  </g>
  <g font-size="10.5" fill="#444444" text-anchor="end">
    <text x="90" y="364">0.24</text><text x="90" y="321">0.22</text><text x="90" y="278">0.20</text>
    <text x="90" y="235">0.18</text><text x="90" y="192">0.16</text><text x="90" y="149">0.14</text>
    <text x="90" y="107">0.12</text><text x="90" y="64">0.10</text>
  </g>
  <text x="40" y="210" font-size="11" fill="#333333" text-anchor="middle" transform="rotate(-90 40 210)">AbsRel (낮을수록 정확)</text>
  <g font-size="10.5" fill="#444444" text-anchor="middle">
    <text x="107.8" y="378">3M</text><text x="258.9" y="378">10M</text>
    <text x="396.7" y="378">30M</text><text x="547.8" y="378">100M</text>
  </g>
  <text x="290" y="398" font-size="11" fill="#333333" text-anchor="middle">파라미터 수 (로그 척도)</text>

  <!-- DA v2 Small -->
  <circle cx="372.8" cy="329.1" r="27.9" fill="#c0670c" fill-opacity="0.14" stroke="#c0670c" stroke-width="1.3"/>
  <circle cx="372.8" cy="329.1" r="2.6" fill="#c0670c"/>
  <text x="406" y="320" font-size="11.5" font-weight="600" fill="#8a4a08">동급 규모 모델 · 24.8M</text>
  <text x="406" y="336" font-size="10.5" fill="#8a4a08">AbsRel 0.2256 · δ1 0.9050</text>
  <text x="406" y="350" font-size="10.5" fill="#8a4a08">프레임 간 변동 0.9920</text>

  <!-- DA3 Base -->
  <circle cx="570.7" cy="112.3" r="9.0" fill="#7b5aa6" fill-opacity="0.16" stroke="#7b5aa6" stroke-width="1.3"/>
  <circle cx="570.7" cy="112.3" r="2.6" fill="#7b5aa6"/>
  <text x="586" y="101" font-size="11.5" font-weight="600" fill="#59417d">대형 범용 모델 · 0.12B</text>
  <text x="586" y="117" font-size="10.5" fill="#59417d">AbsRel 0.1244 · δ1 0.8790</text>
  <text x="586" y="131" font-size="10.5" fill="#59417d">프레임 간 변동 0.1024</text>

  <!-- proposed -->
  <circle cx="143.9" cy="187.5" r="7.7" fill="#0f5c96" fill-opacity="0.22" stroke="#0f5c96" stroke-width="1.8"/>
  <circle cx="143.9" cy="187.5" r="2.6" fill="#0f5c96"/>
  <text x="162" y="176" font-size="11.5" font-weight="600" fill="#0b3f68">제안 모델 · 4M</text>
  <text x="162" y="192" font-size="10.5" fill="#0b3f68">AbsRel 0.1595 · δ1 0.8262</text>
  <text x="162" y="206" font-size="10.5" font-weight="600" fill="#0b3f68">프레임 간 변동 0.0751 — 최소</text>

  <!-- size legend -->
  <text x="100" y="429" font-size="10.5" fill="#444444">원 크기 = 프레임 간 변동</text>
  <circle cx="300" cy="425" r="7.7" fill="#999999" fill-opacity="0.16" stroke="#999999" stroke-width="1.1"/>
  <text x="312" y="429" font-size="10" fill="#666666">0.075</text>
  <circle cx="372" cy="425" r="9.0" fill="#999999" fill-opacity="0.16" stroke="#999999" stroke-width="1.1"/>
  <text x="385" y="429" font-size="10" fill="#666666">0.102</text>
  <circle cx="470" cy="425" r="27.9" fill="#999999" fill-opacity="0.16" stroke="#999999" stroke-width="1.1"/>
  <text x="502" y="429" font-size="10" fill="#666666">0.992</text>

  <!-- note -->
  <text x="40" y="459" font-size="10" fill="#666666">30배 큰 대형 모델에는 정확도에서 열위, 동급 규모 모델에는 δ1을 제외한 전 지표에서 우위,</text>
  <text x="40" y="473" font-size="10" fill="#666666">프레임 간 변동은 세 모델 중 최소. 워프 기반 시간 지표까지 포함한 전반적 우위는 주장하지 않는다.</text>
</svg>
