<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="Helvetica, Arial, 'Noto Sans KR', sans-serif">
  <rect width="940" height="470" fill="#ffffff"/>

  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="7.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7.2,3 L0,6 z" fill="#333333"/>
    </marker>
    <marker id="arwS" markerWidth="8" markerHeight="8" refX="7.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7.2,3 L0,6 z" fill="#666666"/>
    </marker>
    <marker id="arwSb" markerWidth="8" markerHeight="8" refX="0.8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M7.2,0 L0,3 L7.2,6 z" fill="#666666"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="15" font-weight="600" fill="#111111">Figure. 제안 프레임워크의 처리 흐름</text>

  <!-- ===== connectors (drawn first, under the boxes) ===== -->
  <g stroke="#333333" stroke-width="1.4" fill="none" marker-end="url(#arw)">
    <path d="M140,200 H196"/>
    <path d="M330,200 H386"/>
    <path d="M590,200 H646"/>
    <path d="M760,200 H816"/>
    <path d="M265,124 V162"/>
    <path d="M265,234 V296"/>
    <path d="M317,339 H490 V264"/>
  </g>
  <g stroke="#666666" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arw)">
    <path d="M170,200 V93 H201"/>
  </g>
  <circle cx="170" cy="200" r="2.6" fill="#333333"/>

  <!-- cache: bidirectional -->
  <g stroke="#666666" stroke-width="1.2" fill="none" marker-end="url(#arwS)" marker-start="url(#arwSb)">
    <path d="M437,126 V138"/>
    <path d="M543,126 V138"/>
  </g>

  <!-- ===== top band ===== -->
  <rect x="205" y="62" width="120" height="62" rx="2" fill="#fdf3e8" stroke="#c0670c" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="265" y="84" font-size="11.5" font-weight="600" fill="#8a4a08" text-anchor="middle">전역 모션 보정</text>
  <text x="265" y="100" font-size="10" fill="#8a4a08" text-anchor="middle">저해상도 특징점 추적</text>
  <text x="265" y="114" font-size="10" fill="#8a4a08" text-anchor="middle">+ 강건 호모그래피</text>
  <text x="40" y="80" font-size="10" fill="#8a4a08">이동 카메라일 때만</text>
  <text x="40" y="94" font-size="10" fill="#8a4a08">추가되는 선택 경로</text>

  <rect x="390" y="62" width="95" height="62" rx="2" fill="#f2f2f2" stroke="#555555" stroke-width="1.2"/>
  <text x="437" y="88" font-size="11" font-weight="600" fill="#333333" text-anchor="middle">공간 캐시</text>
  <text x="437" y="105" font-size="10" fill="#555555" text-anchor="middle">정적 패치 출력</text>

  <rect x="495" y="62" width="95" height="62" rx="2" fill="#f2f2f2" stroke="#555555" stroke-width="1.2"/>
  <text x="543" y="88" font-size="11" font-weight="600" fill="#333333" text-anchor="middle">시간 캐시</text>
  <text x="543" y="105" font-size="10" fill="#555555" text-anchor="middle">패치별 은닉 상태</text>

  <text x="605" y="88" font-size="10" fill="#555555">두 캐시가 연산 절감의</text>
  <text x="605" y="102" font-size="10" fill="#555555">실제 출처</text>
  <text x="605" y="116" font-size="10" font-weight="600" fill="#333333">1.644 → 0.608 GMAC</text>

  <!-- ===== main row ===== -->
  <rect x="40" y="166" width="100" height="68" rx="2" fill="#f7f7f7" stroke="#333333" stroke-width="1.2"/>
  <text x="90" y="194" font-size="11.5" font-weight="600" fill="#111111" text-anchor="middle">입력 프레임</text>
  <text x="90" y="211" font-size="10" fill="#555555" text-anchor="middle">t−1, t</text>

  <rect x="200" y="166" width="130" height="68" rx="2" fill="#eaf1f8" stroke="#0f5c96" stroke-width="1.2"/>
  <text x="265" y="190" font-size="11.5" font-weight="600" fill="#0b3f68" text-anchor="middle">변화 감지</text>
  <text x="265" y="206" font-size="10" fill="#0b3f68" text-anchor="middle">패치별 차이 + 이력 현상</text>
  <text x="265" y="221" font-size="10" fill="#0b3f68" text-anchor="middle">+ 팽창 + 키프레임 갱신</text>

  <rect x="390" y="140" width="200" height="120" rx="2" fill="#eaf4f0" stroke="#00705a" stroke-width="1.4"/>
  <text x="490" y="164" font-size="11.5" font-weight="600" fill="#004a3c" text-anchor="middle">상태공간 백본</text>
  <text x="490" y="180" font-size="10" fill="#004a3c" text-anchor="middle">시간축 · 공간축 블록 교차 적층</text>
  <rect x="406" y="192" width="168" height="46" rx="2" fill="#ffffff" stroke="#00705a" stroke-width="1.2"/>
  <text x="490" y="210" font-size="11" font-weight="600" fill="#004a3c" text-anchor="middle">Δ-게이팅</text>
  <text x="490" y="228" font-size="12" font-style="italic" fill="#004a3c" text-anchor="middle">Δ̃ = M · Δ</text>
  <text x="490" y="252" font-size="10" fill="#004a3c" text-anchor="middle">마스크가 0인 패치는 상태를 그대로 보존</text>

  <rect x="650" y="166" width="110" height="68" rx="2" fill="#f7f7f7" stroke="#333333" stroke-width="1.2"/>
  <text x="705" y="190" font-size="11.5" font-weight="600" fill="#111111" text-anchor="middle">밀집 디코더</text>
  <text x="705" y="207" font-size="10" fill="#555555" text-anchor="middle">64구간 분류</text>
  <text x="705" y="221" font-size="10" fill="#555555" text-anchor="middle">+ 회귀 결합</text>

  <rect x="820" y="166" width="80" height="68" rx="2" fill="#333333" stroke="#111111" stroke-width="1.2"/>
  <text x="860" y="196" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">깊이 지도</text>
  <text x="860" y="213" font-size="10" fill="#dddddd" text-anchor="middle">프레임 t</text>

  <!-- ===== mask ===== -->
  <text x="196" y="322" font-size="11" font-weight="600" fill="#0b3f68" text-anchor="end">변화 마스크 M</text>
  <text x="196" y="339" font-size="10" fill="#555555" text-anchor="end">계산할 패치 = 1</text>
  <text x="196" y="354" font-size="10" fill="#555555" text-anchor="end">건너뛸 패치 = 0</text>
  <g stroke="#8fb4d2" stroke-width="1" fill="#ffffff">
    <rect x="213" y="300" width="26" height="26"/><rect x="239" y="300" width="26" height="26"/>
    <rect x="265" y="300" width="26" height="26"/><rect x="291" y="300" width="26" height="26"/>
    <rect x="213" y="326" width="26" height="26"/><rect x="239" y="326" width="26" height="26" fill="#0f5c96"/>
    <rect x="265" y="326" width="26" height="26" fill="#0f5c96"/><rect x="291" y="326" width="26" height="26"/>
    <rect x="213" y="352" width="26" height="26"/><rect x="239" y="352" width="26" height="26"/>
    <rect x="265" y="352" width="26" height="26"/><rect x="291" y="352" width="26" height="26"/>
  </g>
  <text x="343" y="333" font-size="10" fill="#555555">실내 영상 평균</text>
  <text x="343" y="347" font-size="10" font-weight="600" fill="#0b3f68">32%만 계산</text>

  <!-- ===== fallback note ===== -->
  <rect x="40" y="404" width="860" height="46" rx="2" fill="#fdf3e8" stroke="#c0670c" stroke-width="1.2"/>
  <text x="56" y="424" font-size="11" font-weight="600" fill="#8a4a08">고활동 폴백</text>
  <text x="140" y="424" font-size="10.5" fill="#8a4a08">변화 패치 비율이 40%를 넘으면 해당 프레임은 전체 연산으로 전환하고 두 캐시를 모두 갱신한다.</text>
  <text x="56" y="441" font-size="10.5" fill="#8a4a08">희소 경로가 전체 연산보다 불리해지는 구간을 자동으로 회피하며, 사용한 연산량은 축소 없이 그대로 보고한다.</text>
</svg>
