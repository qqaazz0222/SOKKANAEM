[project]
name = "sokkanaem"
version = "0.1.0"
description = "Spatial-temporal Optimized Key-patch Kernel for Adaptive Network Architecture and Efficient Mamba"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest"]
video = ["opencv-python"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sokkanaem"]
